# Lives in the PUBLIC `unseentech-registry` repo. Self-contained: uses tools/registry-cli.mjs
# (pushed by the private launcher repo's sync-registry.yml) — no access to private code needed.
name: Registry

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # to list the files this push changed (CDN purge below)
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
      - run: node tools/registry-cli.mjs validate recipes
      - run: node tools/registry-cli.mjs paginate videos.json pages
      # Catalog index with a sha256 per recipe (app verifies CDN copies against it, feature 002).
      - run: node tools/registry-cli.mjs index recipes recipes/index.json
      - name: Index must be up to date in pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- recipes/index.json || { echo "::error::run 'node tools/registry-cli.mjs index recipes recipes/index.json' and commit"; exit 1; }
      - if: github.event_name == 'push'
        run: |
          git config user.name "registry-bot"
          git config user.email "registry-bot@users.noreply.github.com"
          git add pages recipes/index.json
          git diff --cached --quiet || { git commit -m "chore(registry): regenerate pages and index [skip ci]"; git push; }
      # jsDelivr caches @main for up to 12 h; the app falls back to it when raw GitHub is blocked
      # (some mobile networks), so new/changed recipes would stay invisible. Purge what changed.
      - name: Purge jsDelivr cache for changed files
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" HEAD -- recipes pages videos.json)
          else
            changed=$(git ls-files recipes pages videos.json)
          fi
          for path in recipes/index.json $changed; do
            [ -f "$path" ] || continue
            curl -fsS --retry 2 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/${path}" > /dev/null \
              && echo "purged $path" || echo "::warning::could not purge $path"
          done
